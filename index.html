<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星际科技影视站</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.14/dist/hls.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 主题 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: #050816;
            background-image: radial-gradient(circle at 50% 50%, #101a35 0%, #050816 100%);
            color: #e0f0ff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 验证码遮罩层（全屏覆盖，z-index 最高） ===== */
        #verifyOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 8, 22, 0.98);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .verify-box {
            background: #0f1a3a;
            border: 2px solid #2a6aff;
            border-radius: 16px;
            padding: 40px 45px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 40px rgba(42, 106, 255, 0.3);
            text-align: center;
        }

        .verify-box h2 {
            color: #489cff;
            font-size: 24px;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .verify-box p {
            color: #9bb8e6;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .verify-input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .verify-input {
            flex: 1;
            min-width: 140px;
            height: 46px;
            background: #0a142b;
            border: 1px solid #2a6aff;
            border-radius: 6px;
            color: #fff;
            padding: 0 16px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            transition: border-color 0.2s;
        }
        .verify-input:focus {
            border-color: #5a9aff;
        }
        .verify-input::placeholder {
            color: #5577aa;
            font-size: 14px;
            letter-spacing: 0;
        }

        .verify-btn {
            height: 46px;
            background: #2a6aff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            padding: 0 28px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .verify-btn:hover {
            background: #1a4fcc;
        }

        .verify-error {
            color: #ff6b7a;
            font-size: 14px;
            margin-top: 16px;
            min-height: 22px;
        }

        /* ===== 主页面（验证通过后显示） ===== */
        .main-page {
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
            display: none;
        }

        /* ===== 头部 ===== */
        .header-wrap {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .title-group {
            display: flex;
            align-items: baseline;
            gap: 18px;
            flex-wrap: wrap;
        }

        .site-title {
            font-size: 36px;
            color: #489cff;
            text-shadow: 0 0 10px #2a6aff;
            white-space: nowrap;
        }

        .movie-count {
            color: #7abaff;
            font-size: 16px;
            font-weight: 400;
            background: rgba(42, 106, 255, 0.12);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(42, 106, 255, 0.25);
            white-space: nowrap;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }

        .search-group {
            display: flex;
            align-items: center;
            gap: 0;
            margin-left: auto;
        }

        .search-input {
            width: 260px;
            height: 42px;
            background: #0a142b;
            border: 1px solid #2a6aff;
            border-right: none;
            border-radius: 6px 0 0 6px;
            color: #fff;
            padding: 0 15px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: #5a9aff;
        }
        .search-input::placeholder {
            color: #7799cc;
        }

        .search-btn {
            height: 42px;
            background: #2a6aff;
            border: 1px solid #2a6aff;
            border-radius: 0 6px 6px 0;
            color: #fff;
            padding: 0 20px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-btn:hover {
            background: #1a4fcc;
            border-color: #1a4fcc;
        }

        /* ===== 影片网格 ===== */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 20px;
            margin-bottom: 50px;
        }

        .movie-item {
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }
        .movie-item:hover {
            transform: translateY(-8px);
        }

        .poster {
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 8px;
            border: 2px solid #203a70;
            box-shadow: 0 0 12px #1a305888;
            object-fit: cover;
            margin-bottom: 10px;
            background: #0a142b;
            /* 图片加载失败时显示底色 */;
        }

        .movie-name {
            color: #c0e0ff;
            text-decoration: none;
            font-size: 14px;
            display: block;
        }
        .movie-name:hover {
            color: #2a6aff;
        }

        /* ===== 分页 ===== */
        .page-box {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 10px 8px;
            margin: 40px 0 20px 0;
            max-width: 100%;
            justify-items: center;
            align-items: center;
        }

        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 6px 0;
            background: #122044;
            border: 1px solid #2a6aff;
            color: #e0f0ff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            transition: 0.2s;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .page-btn:hover {
            background: #1e3a7a;
            border-color: #5a9aff;
        }
        .page-btn.active {
            background: #2a6aff;
            border-color: #7abaff;
            box-shadow: 0 0 12px #2a6aff88;
        }

        /* ===== 视频弹窗 ===== */
        .video-pop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            padding: 40px 20px;
        }

        .video-wrap {
            width: 100%;
            max-width: 1920px;
            max-height: calc(100vh - 120px);
        }

        video {
            width: 100%;
            height: auto;
            max-height: calc(100vh - 120px);
            border-radius: 8px;
            border: 2px solid #000000;
            object-fit: contain;
            background: #000;
        }

        .close-video {
            position: absolute;
            top: 30px;
            right: 50px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            user-select: none;
        }

        /* ===== 影片信息浮层（左上角名称 + 复制按钮） ===== */
        .video-info {
            position: absolute;
            top: 30px;
            left: 50px;
            z-index: 15;
            display: none;
            pointer-events: none;
        }

        .video-info .video-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.5px;
            padding: 4px 0;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 16px;
            border-radius: 6px;
            backdrop-filter: blur(2px);
            display: inline-block;
            margin-bottom: 6px;
        }

        .video-info .copy-btn {
            pointer-events: auto;
            background: rgba(42, 106, 255, 0.75);
            border: none;
            color: #fff;
            padding: 2px 14px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: inline-block;
            backdrop-filter: blur(2px);
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.3px;
            font-weight: 400;
            margin-left: 2px;
        }
        .video-info .copy-btn:hover {
            background: rgba(42, 106, 255, 1);
            transform: scale(1.04);
        }
        .video-info .copy-btn:active {
            transform: scale(0.95);
        }
        .video-info .copy-btn.copied {
            background: rgba(0, 200, 80, 0.8);
        }


        /* ===== 响应式适配 ===== */
        @media (max-width: 1024px) {
            .movie-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 15px;
            }
            .header-wrap {
                gap: 16px;
            }
            .page-btn {
                font-size: 12px;
                padding: 4px 0;
            }
            .page-box {
                gap: 6px 4px;
            }
            .site-title {
                font-size: 28px;
            }
            .movie-count {
                font-size: 14px;
                padding: 3px 12px;
            }
            .search-input {
                width: 200px;
            }
            .verify-box {
                padding: 30px 28px;
            }
        }

        @media (max-width: 768px) {
            .movie-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .header-wrap {
                flex-direction: row;
                align-items: center;
                gap: 12px;
            }
            .title-group {
                gap: 10px;
            }
            .site-title {
                font-size: 22px;
                white-space: nowrap;
            }
            .movie-count {
                font-size: 12px;
                padding: 2px 10px;
            }
            .search-group {
                margin-left: auto;
                width: auto;
            }
            .search-input {
                width: 130px;
                height: 36px;
                font-size: 13px;
                padding: 0 10px;
            }
            .search-btn {
                height: 36px;
                padding: 0 14px;
                font-size: 13px;
            }
            .main-page {
                padding: 15px 12px;
            }
            .close-video {
                top: 15px;
                right: 20px;
                font-size: 40px;
            }
            .video-pop {
                padding: 20px 10px;
            }
            .page-btn {
                font-size: 10px;
                padding: 3px 0;
                border-width: 1px;
            }
            .page-box {
                gap: 4px 3px;
            }
            .verify-box {
                padding: 28px 20px;
            }
            .verify-box h2 {
                font-size: 20px;
            }
            .verify-input {
                height: 40px;
                font-size: 16px;
                min-width: 100px;
            }
            .verify-btn {
                height: 40px;
                font-size: 16px;
                padding: 0 20px;
            }
        }

        @media (max-width: 480px) {
            .movie-grid {
                gap: 10px;
            }
            .movie-name {
                font-size: 12px;
            }
            .header-wrap {
                gap: 8px;
            }
            .title-group {
                gap: 6px;
            }
            .site-title {
                font-size: 18px;
            }
            .movie-count {
                font-size: 10px;
                padding: 2px 8px;
                border-radius: 12px;
            }
            .search-group {
                margin-left: auto;
            }
            .search-input {
                width: 90px;
                height: 32px;
                font-size: 11px;
                padding: 0 8px;
            }
            .search-btn {
                height: 32px;
                padding: 0 10px;
                font-size: 11px;
            }
            .page-btn {
                font-size: 9px;
                padding: 2px 0;
                border-radius: 3px;
            }
            .page-box {
                gap: 3px 2px;
                margin: 30px 0 10px 0;
            }
            .verify-box {
                padding: 20px 16px;
            }
            .verify-box h2 {
                font-size: 18px;
            }
            .verify-input {
                height: 36px;
                font-size: 14px;
                min-width: 80px;
                padding: 0 10px;
            }
            .verify-btn {
                height: 36px;
                font-size: 14px;
                padding: 0 16px;
            }
            .verify-input-group {
                gap: 8px;
            }
        }

        @media (max-width: 360px) {
            .page-btn {
                font-size: 7px;
                padding: 1px 0;
                border-radius: 2px;
            }
            .page-box {
                gap: 2px 1px;
            }
            .site-title {
                font-size: 15px;
            }
            .movie-count {
                font-size: 9px;
                padding: 1px 6px;
            }
            .search-input {
                width: 70px;
                height: 28px;
                font-size: 10px;
                padding: 0 5px;
            }
            .search-btn {
                height: 28px;
                padding: 0 6px;
                font-size: 10px;
            }
        }

        /* ===== 当视频全屏时，覆盖样式让视频填满屏幕 ===== */
        video:fullscreen {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            object-fit: contain;
            border-radius: 0;
            border: none;
            background: #000;
        }
        video:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            object-fit: contain;
            border-radius: 0;
            border: none;
            background: #000;
        }
        video:-moz-full-screen {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            object-fit: contain;
            border-radius: 0;
            border: none;
            background: #000;
        }

    </style>
</head>
<body>

    <!-- ===== 验证码遮罩层 ===== -->
    <div id="verifyOverlay">
        <div class="verify-box">
            <h2>🔐 验证访问</h2>
            <p></p>
            <div class="verify-input-group">
                <input class="verify-input" id="verifyInput" type="password" placeholder="验证码" maxlength="20" autofocus />
                <button class="verify-btn" id="verifyBtn">确认</button>
            </div>
            <div class="verify-error" id="verifyError"></div>
        </div>
    </div>

    <!-- ===== 主页面 ===== -->
    <div class="main-page" id="mainPage">
        <div class="header-wrap">
            <div class="title-group">
                <h1 class="site-title">星际科技影视库</h1>
                <span class="movie-count" id="movieCount">共 0 部影片</span>
            </div>
            <div class="search-group">
                <input class="search-input" id="searchBox" placeholder="输入影片名称..." />
                <button class="search-btn" id="searchBtn">检索</button>
            </div>
        </div>

        <div class="movie-grid" id="movieGrid"></div>
        <div class="page-box" id="pageBox"></div>
    </div>

    <!-- ===== 视频弹窗 ===== -->
    <div class="video-pop" id="videoPop">
        <span class="close-video" id="closeVideoBtn">×</span>

        <!-- 影片信息浮层 -->
        <div class="video-info" id="videoInfo">
            <div class="video-title" id="videoTitle"></div>
            <button class="copy-btn" id="copyBtn">复制</button>
        </div>

        <div class="video-wrap">
            <video id="myVideo" controls></video>
        </div>
    </div>

    <!-- ===== 外部影片数据 ===== -->
    <script src="other/data.js">
    </script>

    <script>
        // ============================================================
        //  验证码逻辑
        // ============================================================
        (function() {
            const overlay = document.getElementById('verifyOverlay');
            const verifyInput = document.getElementById('verifyInput');
            const verifyBtn = document.getElementById('verifyBtn');
            const verifyError = document.getElementById('verifyError');
            const mainPage = document.getElementById('mainPage');
            const __part1 = [65, 98, 99]; // A, b, c
            const __part2 = [64, 50, 48, 50, 56, 33]; // @, 2, 0, 2, 8, !
            const CORRECT_CODE = String.fromCharCode.apply(null, __part1.concat(__part2)); 

            function verifySuccess() {
                overlay.style.display = 'none';
                mainPage.style.display = 'block';
                document.getElementById('searchBox').focus();
                renderCurrentPage();
            }

            function verifyFail() {
                verifyError.textContent = '验证码错误，请重新输入';
                verifyInput.value = '';
                verifyInput.focus();
            }

            function attemptVerify() {
                const inputCode = verifyInput.value.trim();
                if (inputCode === CORRECT_CODE) {
                    verifySuccess();
                } else {
                    verifyFail();
                }
            }

            verifyBtn.addEventListener('click', function(e) {
                e.preventDefault();
                attemptVerify();
            });

            verifyInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    attemptVerify();
                }
            });

            verifyInput.focus();
        })();

        // ============================================================
        //  主页面逻辑
        // ============================================================

        const pageSize = 40;
        let currentPage = 1;
        let hlsIns = null;

        const video = document.getElementById("myVideo");
        const pop = document.getElementById("videoPop");
        const searchBox = document.getElementById("searchBox");
        const searchBtn = document.getElementById("searchBtn");
        const movieCountEl = document.getElementById("movieCount");
        const closeBtn = document.getElementById("closeVideoBtn");  // 获取关闭按钮

        // ===== 影片信息相关 =====
        const videoInfo = document.getElementById("videoInfo");
        const videoTitle = document.getElementById("videoTitle");
        const copyBtn = document.getElementById("copyBtn");

        let currentVideoTitle = '';
        let currentVideoSrc = '';
        let isVideoPlaying = false;
        let isInfoVisible = false;
        let hideTimer = null;
        let copyTimer = null;

        // ---- 显示影片信息 ----
        function showVideoInfo(title, src) {
            if (!title) title = '未知影片';
            currentVideoTitle = title;
            currentVideoSrc = src || '';

            videoTitle.textContent = title;
            videoInfo.style.display = 'block';
            isInfoVisible = true;
            copyBtn.textContent = '复制';
            copyBtn.classList.remove('copied');
            if (copyTimer) {
                clearTimeout(copyTimer);
                copyTimer = null;
            }
            resetHideTimer();
        }

        // ---- 隐藏影片信息 ----
        function hideVideoInfo() {
            videoInfo.style.display = 'none';
            isInfoVisible = false;
            if (hideTimer) {
                clearTimeout(hideTimer);
                hideTimer = null;
            }
        }

        // ---- 重置计时器（鼠标移动时调用） ----
        function resetHideTimer() {
            if (hideTimer) {
                clearTimeout(hideTimer);
                hideTimer = null;
            }
            hideTimer = setTimeout(function() {
                if (isInfoVisible && isVideoPlaying) {
                    hideVideoInfo();
                }
            }, 3000);
        }

        // ---- 复制功能 ----
        function handleCopy(e) {
            e.stopPropagation();
            if (!currentVideoSrc) {
                copyBtn.textContent = '无链接';
                setTimeout(function() {
                    copyBtn.textContent = '复制';
                }, 1500);
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentVideoSrc).then(function() {
                    copyBtn.textContent = '已复制 ✓';
                    copyBtn.classList.add('copied');
                    if (copyTimer) clearTimeout(copyTimer);
                    copyTimer = setTimeout(function() {
                        copyBtn.textContent = '复制';
                        copyBtn.classList.remove('copied');
                        copyTimer = null;
                    }, 2000);
                }).catch(function() {
                    fallbackCopy(currentVideoSrc);
                });
            } else {
                fallbackCopy(currentVideoSrc);
            }
        }

        // ---- 降级复制方案 ----
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                copyBtn.textContent = '已复制 ✓';
                copyBtn.classList.add('copied');
                if (copyTimer) clearTimeout(copyTimer);
                copyTimer = setTimeout(function() {
                    copyBtn.textContent = '复制';
                    copyBtn.classList.remove('copied');
                    copyTimer = null;
                }, 2000);
            } catch (err) {
                copyBtn.textContent = '复制失败';
                setTimeout(function() {
                    copyBtn.textContent = '复制';
                }, 1500);
            }
            document.body.removeChild(textarea);
        }

        copyBtn.addEventListener('click', handleCopy);

        /**
         * 图片加载失败时，替换为同目录下的默认图片
         * 注意：请在 HTML 同目录下放置 default.jpg 作为默认海报
         */
        function handleImageError(img) {
            // 防止无限循环
            img.onerror = null;
            img.src = 'other/default.jpg';
        }

        function handleSearch() {
            currentPage = 1;
            renderCurrentPage();
        }

        function renderCurrentPage() {
            if (typeof movieList === 'undefined') {
                console.warn('movieList 未定义，请检查 data.js 是否加载');
                return;
            }
            const keyword = searchBox.value.toLowerCase();
            const filterList = movieList.filter(item => item.name.toLowerCase().includes(keyword));
            const totalPage = Math.ceil(filterList.length / pageSize);

            movieCountEl.textContent = `共 ${filterList.length} 部影片`;

            if (currentPage > totalPage) currentPage = totalPage || 1;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * pageSize;
            const pageData = filterList.slice(start, start + pageSize);

            const grid = document.getElementById("movieGrid");
            grid.innerHTML = "";
            pageData.forEach(item => {
                const div = document.createElement("div");
                div.className = "movie-item";
                div.innerHTML = `
                            <img src="${item.img}" class="poster" alt="${item.name}" onerror="handleImageError(this)" />
                            <span class="movie-name">${item.name}</span>
                        `;
                div.onclick = () => playVideo(item.vid, item.name);
                grid.appendChild(div);
            });

            const pageBox = document.getElementById("pageBox");
            pageBox.innerHTML = "";
            for (let i = 1; i <= totalPage; i++) {
                const a = document.createElement("a");
                a.className = "page-btn" + (i === currentPage ? " active" : "");
                a.textContent = i;
                a.href = "javascript:void(0)";
                a.onclick = (function(pageNum) {
                    return function(e) {
                        e.preventDefault();
                        switchPage(pageNum);
                    };
                })(i);
                pageBox.appendChild(a);
            }
        }

        function switchPage(num) {
            currentPage = num;
            renderCurrentPage();
            document.getElementById("pageBox").scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        function playVideo(src, title) {
            if (!src) return;
            currentVideoSrc = src;
            currentVideoTitle = title || '未知影片';
            isVideoPlaying = true;

            pop.style.display = "flex";

            // 显示影片名称
            showVideoInfo(currentVideoTitle, currentVideoSrc);

            if (hlsIns) {
                hlsIns.destroy();
                hlsIns = null;
            }
            video.pause();
            video.src = "";
            video.onerror = () => {
                alert("当前不支持该文件类型，请尝试其他文件");
                closeVideo();
            };

            if (src.endsWith(".m3u8")) {
                if (Hls.isSupported()) {
                    hlsIns = new Hls();
                    hlsIns.loadSource(src);
                    hlsIns.attachMedia(video);
                    hlsIns.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(() => {});
                    });
                } else {
                    alert("当前浏览器不支持 HLS 播放，请尝试其他文件");
                    closeVideo();
                }
            } else {
                video.src = src;
                video.play().catch(() => {});
            }
        }

        function closeVideo() {
            isVideoPlaying = false;
            hideVideoInfo();
            video.onerror = null;
            video.pause();
            if (hlsIns) {
                hlsIns.destroy();
                hlsIns = null;
            }
            video.src = "";
            pop.style.display = "none";
            if (copyTimer) {
                clearTimeout(copyTimer);
                copyTimer = null;
            }
            copyBtn.textContent = '复制';
            copyBtn.classList.remove('copied');
        }

        // 关闭按钮事件（使用获取到的 closeBtn）
        closeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            closeVideo();
        });

        pop.addEventListener('click', function(e) {
            if (e.target === pop) closeVideo();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeVideo();
        });

        // ============================================================
        //  鼠标交互：控制影片信息的显隐（鼠标不动3秒消失）
        // ============================================================

        pop.addEventListener('mousemove', function(e) {
            if (!isVideoPlaying) return;
            if (!isInfoVisible) {
                showVideoInfo(currentVideoTitle, currentVideoSrc);
            } else {
                resetHideTimer();
            }
        });

        pop.addEventListener('mouseenter', function() {
            if (!isVideoPlaying) return;
            if (!isInfoVisible) {
                showVideoInfo(currentVideoTitle, currentVideoSrc);
            } else {
                resetHideTimer();
            }
        });

        pop.addEventListener('mouseleave', function() {
            if (isVideoPlaying && isInfoVisible) {
                hideVideoInfo();
            }
        });

        // ============================================================
        //  播放器快捷键：空格 左右 上下 F
        // ============================================================

        document.addEventListener('keydown', function(e) {
            if (pop.style.display !== 'flex') return; // 仅当弹窗显示时

            const tag = e.target.tagName.toLowerCase();
            if (tag === 'input' || tag === 'textarea') return; // 不在输入框中

            const key = e.key;
            let handled = true;

            switch (key) {
                case ' ':
                case 'Space':
                    e.preventDefault();
                    if (video.paused) {
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                    }
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    video.volume = Math.min(1, video.volume + 0.1);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    video.volume = Math.max(0, video.volume - 0.1);
                    break;
                case 'f':
                case 'F':
                    e.preventDefault();
                    if (video.requestFullscreen) {
                        video.requestFullscreen().catch(() => {});
                    } else if (video.webkitRequestFullscreen) {
                        video.webkitRequestFullscreen();
                    }
                    break;
                default:
                    handled = false;
            }

            if (handled) {
                e.stopPropagation();
            }
        });

        // ============================================================
        //  绑定搜索事件
        // ============================================================

        searchBox.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSearch();
            }
        });

        searchBtn.addEventListener('click', function(e) {
            e.preventDefault();
            handleSearch();
        });

        // ============================================================
        //  初始化渲染
        // ============================================================

        renderCurrentPage();
    </script>

</body>
</html>
